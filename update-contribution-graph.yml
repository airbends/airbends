name: Update Contribution Graph

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SVG from real contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          GITHUB_USERNAME: airbends
          OUTPUT_PATH: contribution-graph.svg
        run: python3 generate_contribution_svg.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-graph.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update contribution graph"
          git push
