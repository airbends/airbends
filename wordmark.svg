from pathlib import Path

ASCII = r"""
██╗██████╗ ███████╗███████╗ █████╗ ███╗   ██╗
██║██╔══██╗██╔════╝██╔════╝██╔══██╗████╗  ██║
██║██████╔╝█████╗  █████╗  ███████║██╔██╗ ██║
██║██╔══██╗██╔══╝  ██╔══╝  ██╔══██║██║╚██╗██║
██║██║  ██║██║     ██║     ██║  ██║██║ ╚████║
╚═╝╚═╝  ╚═╝╚═╝     ╚═╝     ╚═╝  ╚═╝╚═╝  ╚═══╝
""".strip("\n")

lines = ASCII.splitlines()

font_size = 18
line_height = 22
margin = 20

max_chars = max(len(x) for x in lines)

width = max_chars * 11 + margin * 2
height = len(lines) * line_height + margin * 2

svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
width="{width}"
height="{height}"
viewBox="0 0 {width} {height}">

<rect width="100%" height="100%" fill="#0d1117"/>

<style>
text {{
    font-family: Consolas, "Courier New", monospace;
    font-size:{font_size}px;
    fill:#c9d1d9;
    white-space:pre;
}}

.line {{
    opacity:0;
    transform:translateX(-40px);
    animation:slide .45s forwards;
}}

@keyframes slide {{
    to {{
        opacity:1;
        transform:translateX(0);
    }}
}}
</style>
'''

for i, line in enumerate(lines):
    y = margin + (i + 1) * line_height
    delay = i * 0.18

    svg += f'''
<text class="line"
x="{margin}"
y="{y}"
style="animation-delay:{delay}s">{line}</text>
'''

svg += "</svg>"

Path("wordmark.svg").write_text(svg, encoding="utf-8")

print("Generated wordmark.svg")
